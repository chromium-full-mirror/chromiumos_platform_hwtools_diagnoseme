#
# Maui override of docker-compose-prod.yaml (installed as
# /etc/diagnoseme/docker-compose-maui.yaml by the Maui edition packages only;
# their config.env selects it with
# COMPOSE_FILE=/etc/diagnoseme/docker-compose.yaml:/etc/diagnoseme/docker-compose-maui.yaml).
# Servo / Dolos stations neither mount nor create these directories. The H2H
# firmware directory of Maui v1.2 is in docker-compose-maui-h2h.yaml.

services:
  server:
    environment:
      - DIAGNOSEME_DEVICE_LOG_DIR=/var/log/diagnoseme/devices
      # Maui results directory of the edition (config.env); mounted 1:1.
      - DIAGNOSEME_RESULTS_DIR=${DIAGNOSEME_RESULTS_DIR:?DIAGNOSEME_RESULTS_DIR is not set in /etc/diagnoseme/config.env}
      # maui-utils image of the Maui host tools (config.env: the bundled
      # stable release; when empty the server uses the newest local one).
      - MAUI_UTILS_IMAGE
      # Optional Maui v1.2 test overrides (config.local.env).
      - MAUI_V12_APPROVED_FW
      - MAUI_V12_HWREVS
      - MAUI_ITE_NO_OUTPUT_TIMEOUT_S
      # Optional ADB transfer test overrides (config.local.env).
      - MAUI_ADB_SIZE_MB
      - MAUI_ADB_DEADLINE_S
      - MAUI_ADB_MIN_RATE_MB_S
      - MAUI_ADB_MIN_LINK_MBPS
    volumes:
      - /var/log/diagnoseme/devices:/var/log/diagnoseme/devices
      - ${DIAGNOSEME_RESULTS_DIR:?DIAGNOSEME_RESULTS_DIR is not set}:${DIAGNOSEME_RESULTS_DIR:?DIAGNOSEME_RESULTS_DIR is not set}
      - /var/lib/diagnoseme/firmware:/var/lib/diagnoseme/firmware:ro
      # Firmware staged for the maui-utils container (src/server/maui_utils_runner.py).
      - /var/lib/diagnoseme/maui-utils/staging:/var/lib/diagnoseme/maui-utils/staging
