services:
  ##############################################################################
  ui:
    container_name: ui
    image: ui
    pull_policy: never
    hostname: ui
    restart: unless-stopped

    networks:
      diagnoseme:
        ipv4_address: 192.168.100.10

    volumes:
      - logs:/var/log/nginx

  ##############################################################################
  server:
    container_name: server
    image: server
    pull_policy: never
    hostname: server
    restart: unless-stopped
    privileged: true

    networks:
      diagnoseme:
        ipv4_address: 192.168.100.11

    volumes:
      - logs:/var/log/rpcserver
      - /dev:/dev
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/diagnoseme:/usr/local/server/binfiles

  #############################################################################
  envoy:
    container_name: envoy
    image: envoy
    pull_policy: never
    restart: unless-stopped
    environment:
      ENVOY_UID: 0

    networks:
      diagnoseme:
        ipv4_address: 192.168.100.12

    hostname: envoy-proxy
    volumes:
      - logs:/var/log/envoy

    ports:
      - 8888:6001
  #############################################################################

volumes:
  logs: {}

networks:
  diagnoseme:
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: "192.168.100.0/24"
