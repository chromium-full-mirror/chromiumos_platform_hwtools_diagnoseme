services:
  ##############################################################################
  ui:
    container_name: ui
    image: ui
    pull_policy: if_not_present
    hostname: ui
    restart: unless-stopped

    networks:
      diagnoseme:
        ipv4_address: 192.168.100.10

    volumes:
      - logs:/var/log/nginx

  ##############################################################################
  server:
    container_name: server
    image: server
    pull_policy: if_not_present
    hostname: server
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - TEST_DUT=brya
      - TEST_MODEL=banshee
      - RESULTS_SERVER=${RESULTS_SERVER:-}
      # Optional maui-utils image override (default: the image's pin).
      - MAUI_UTILS_IMAGE
      # Optional Maui v1.2 test overrides (passed through when set).
      - MAUI_V12_APPROVED_FW
      - MAUI_V12_HWREVS
      - MAUI_ITE_NO_OUTPUT_TIMEOUT_S
      # Optional ADB transfer test overrides (passed through when set).
      - MAUI_ADB_SIZE_MB
      - MAUI_ADB_DEADLINE_S
      - MAUI_ADB_MIN_RATE_MB_S

    volumes:
      - logs:/var/log/rpcserver
      - /dev:/dev
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - ${HOME}/diagnoseme_results:/root/diagnoseme_results

  #############################################################################
  envoy:
    container_name: envoy
    image: envoy
    pull_policy: if_not_present
    restart: unless-stopped
    network_mode: host
    environment:
      ENVOY_UID: 0

    hostname: envoy-proxy
    volumes:
      - logs:/var/log/envoy

  #############################################################################
  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --include-restarting ui server envoy
  #############################################################################

volumes:
  logs: {}

networks:
  diagnoseme:
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: "192.168.100.0/24"
