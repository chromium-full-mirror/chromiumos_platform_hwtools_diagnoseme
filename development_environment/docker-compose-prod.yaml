services:
  ##############################################################################
  ui:
    container_name: ui
    image: us-docker.pkg.dev/chromeos-hw-tools/diagnoseme/ui:${DOCKER_TAG:-maui}
    hostname: ui
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-if_not_present}

    networks:
      diagnoseme:
        ipv4_address: 192.168.100.10

    volumes:
      - /var/log/diagnoseme/nginx:/var/log/nginx

  ##############################################################################
  server:
    container_name: server
    image: us-docker.pkg.dev/chromeos-hw-tools/diagnoseme/server:${DOCKER_TAG:-maui}
    hostname: server
    restart: unless-stopped
    privileged: true
    pull_policy: ${PULL_POLICY:-if_not_present}
    network_mode: host
    environment:
      - TEST_DUT=brya
      - TEST_MODEL=banshee
      - RESULTS_SERVER=${RESULTS_SERVER:-}
      - STATION_ID=${STATION_ID:-}
      # Optional override of the maui-utils image baked into the server image.
      - MAUI_UTILS_IMAGE
      # Optional Maui v1.2 test overrides (see /etc/diagnoseme/config.env).
      - MAUI_V12_APPROVED_FW
      - MAUI_V12_HWREVS
      - MAUI_ITE_NO_OUTPUT_TIMEOUT_S
      # Maui v1.2 H2H firmware directory of the station (config.env, set by
      # start-diagnoseme; shown in the UI and mounted below).
      - MAUI_H2H_FW_DIR=${MAUI_H2H_FW_DIR:-/home/diagnoseme/diagnoseme_h2h_firmware}
      # Optional ADB transfer test overrides (see /etc/diagnoseme/config.env).
      - MAUI_ADB_SIZE_MB
      - MAUI_ADB_DEADLINE_S
      - MAUI_ADB_MIN_RATE_MB_S
      - MAUI_ADB_MIN_LINK_MBPS

    volumes:
      - /var/log/diagnoseme/rpcserver:/var/log/rpcserver
      - /tmp:/tmp
      - /home:/home
      # Results of the desktop user (start-diagnoseme sets the directory).
      - ${DIAGNOSEME_RESULTS_DIR:-/home/diagnoseme/diagnoseme_results}:/root/diagnoseme_results
      - /dev:/dev
      - /sys:/sys
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/diagnoseme/firmware:/var/lib/diagnoseme/firmware:ro
      # Maui v1.2 H2H firmware images (never bundled: copied there by hand).
      - ${MAUI_H2H_FW_DIR:-/home/diagnoseme/diagnoseme_h2h_firmware}:/mnt/h2h_firmware:ro

  #############################################################################
  envoy:
    container_name: envoy
    image: us-docker.pkg.dev/chromeos-hw-tools/diagnoseme/envoy:${DOCKER_TAG:-maui}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-if_not_present}
    network_mode: host
    environment:
      ENVOY_UID: 0

    hostname: envoy-proxy
    volumes:
      - /var/log/diagnoseme/envoy:/var/log/envoy

  #############################################################################
  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    pull_policy: if_not_present
    profiles:
      - online
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --include-restarting ui server envoy
  #############################################################################

networks:
  diagnoseme:
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: "192.168.100.0/24"
