services:
  ##############################################################################
  ui:
    container_name: ui
    image: us-docker.pkg.dev/chromeos-hw-tools/diagnoseme/ui:maui
    hostname: ui
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-if_not_present}

    networks:
      diagnoseme:
        ipv4_address: 192.168.100.10

    volumes:
      - /var/log/diagnoseme/nginx:/var/log/nginx

  ##############################################################################
  server:
    container_name: server
    image: us-docker.pkg.dev/chromeos-hw-tools/diagnoseme/server:maui
    hostname: server
    restart: unless-stopped
    privileged: true
    pull_policy: ${PULL_POLICY:-if_not_present}
    network_mode: host
    environment:
      - TEST_DUT=brya
      - TEST_MODEL=banshee
      - RESULTS_SERVER=${RESULTS_SERVER:-}

    volumes:
      - /var/log/diagnoseme/rpcserver:/var/log/rpcserver
      - /tmp:/tmp
      - /home:/home
      - ${HOME:-/home/diagnoseme}/diagnoseme_results:/root/diagnoseme_results
      - /dev:/dev
      - /sys:/sys
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/diagnoseme/firmware:/var/lib/diagnoseme/firmware:ro

  #############################################################################
  envoy:
    container_name: envoy
    image: us-docker.pkg.dev/chromeos-hw-tools/diagnoseme/envoy:maui
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-if_not_present}
    network_mode: host
    environment:
      ENVOY_UID: 0

    hostname: envoy-proxy
    volumes:
      - /var/log/diagnoseme/envoy:/var/log/envoy

  #############################################################################
  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    pull_policy: if_not_present
    profiles:
      - online
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --include-restarting ui server envoy
  #############################################################################

networks:
  diagnoseme:
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: "192.168.100.0/24"
