steps:
  # Fetch the Realtek tools of servo-dolos (editions.json realtek_tools;
  # fails when they cannot be downloaded) and the deb version
  # (tools/deb_version.sh, 1.1.<YYYYMMDD>).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        mkdir -p dist/firmware dist/maui-utils
        tools/fetch_rtk_tools.sh servo-dolos
        tools/deb_version.sh > dist/deb-version

  # Build the DEB package using Docker. This uploads the Servo / Dolos
  # 'diagnoseme' package (edition servo-dolos), named explicitly: the deb
  # builder has no default edition. Maui packages come from the edition
  # release build (dockerfiles/cloudbuild_release.yaml).
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    # The deb Dockerfile's optional dist/ COPYs need BuildKit (docker 20.10).
    env: ['DOCKER_BUILDKIT=1']
    args:
      - '-c'
      - |
        set -e
        docker build --build-arg EDITION=servo-dolos \
          --build-arg DEB_VERSION="$(cat dist/deb-version)" \
          -t deb-builder-servo-dolos -f development_environment/deb_builder/Dockerfile .

  # Extract the DEB file from the image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        CONTAINER=$(docker create deb-builder-servo-dolos)
        docker cp "$${CONTAINER}:/diagnoseme.deb" .
        docker rm "$${CONTAINER}"

  # Check the package against the servo-dolos edition (editions.json).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'python3'
    args: ['tools/check_deb.py', 'diagnoseme.deb', 'servo-dolos']

  # Upload the DEB to Artifact Registry
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud artifacts apt upload diagnoseme-deb \
          --project=chromeos-hw-tools \
          --location=us \
          --source=diagnoseme.deb
