# --- Localization & Language ---
d-i debian-installer/locale string en_US
d-i keyboard-configuration/xkb-keymap select us

# --- Network Setup ---
d-i netcfg/get_hostname string diagnoseme-server
d-i netcfg/get_domain string local

# --- Mirror Settings ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- Account Setup ---
d-i passwd/root-login boolean false
d-i passwd/user-fullname string diagnoseme
d-i passwd/username string diagnoseme
d-i passwd/user-password password diagnoseme
d-i passwd/user-password-again password diagnoseme
d-i user-setup/allow-password-weak boolean true

# --- Clock & Partitioning ---
d-i clock-setup/utc boolean true
d-i time/zone string US/Pacific
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- Package Selection ---
d-i base-installer/install-recommends boolean false
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string lightdm openbox xserver-xorg xserver-xorg-video-all xserver-xorg-input-all x11-xserver-utils xterm curl wget gnupg build-essential dkms sudo linux-headers-amd64
d-i pkgsel/upgrade select none
d-i pkgsel/updatedb boolean false

# --- Bootloader ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# --- LATE COMMAND (The First-Boot Logic) ---
d-i preseed/late_command string \
  in-target sed -i "s/GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=\"quiet nvme_core.default_ps_max_latency_us=0\"/" /etc/default/grub; \
  in-target update-grub; \
  in-target sh -c "echo '#!/bin/bash' > /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'sleep 15' >> /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'curl -fsSL \"https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3\" | gpg --dearmor -o /usr/share/keyrings/artifact-registry.gpg' >> /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'echo \"deb [signed-by=/usr/share/keyrings/artifact-registry.gpg] https://us-apt.pkg.dev/projects/chromeos-hw-tools diagnoseme-deb main\" > /etc/apt/sources.list.d/diagnoseme.list' >> /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'apt-get update' >> /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'apt-get install -y diagnoseme docker.io docker-compose docker-cli' >> /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'groupadd docker || true' >> /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'usermod -aG docker diagnoseme || true' >> /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'echo \"r8152\" >> /etc/modules' >> /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'echo \"blacklist cdc_ether\" > /etc/modprobe.d/blacklist-diagnoseme.conf' >> /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'update-initramfs -u' >> /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'systemctl disable diagnoseme-setup.service' >> /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'rm -f /usr/local/bin/post-install-setup.sh' >> /usr/local/bin/post-install-setup.sh"; \
  in-target sh -c "echo 'reboot' >> /usr/local/bin/post-install-setup.sh"; \
  in-target chmod +x /usr/local/bin/post-install-setup.sh; \
  in-target sh -c "echo '[Unit]' > /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo 'Description=Finalize Driver Installation' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo 'After=network-online.target' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo '[Service]' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo 'Type=oneshot' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo 'ExecStart=/usr/local/bin/post-install-setup.sh' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo '[Install]' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo 'WantedBy=multi-user.target' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target systemctl enable diagnoseme-setup.service; \
  in-target wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -P /tmp; \
  in-target apt-get install -y /tmp/google-chrome-stable_current_amd64.deb || true; \
  in-target sed -i "s/#autologin-user=/autologin-user=diagnoseme/" /etc/lightdm/lightdm.conf; \
  in-target sed -i "s/#autologin-user-timeout=0/autologin-user-timeout=0/" /etc/lightdm/lightdm.conf; \
  in-target mkdir -p /home/diagnoseme/.config/openbox; \
  in-target sh -c 'echo "google-chrome --start-maximized --no-first-run --no-default-browser-check http://localhost:8888 &" > /home/diagnoseme/.config/openbox/autostart'; \
  in-target chown -R diagnoseme:diagnoseme /home/diagnoseme/.config; \
  in-target groupadd docker || true; \
  in-target usermod -aG docker diagnoseme || true; \
  in-target sh -c 'echo "diagnoseme ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/diagnoseme'; \
  in-target chmod 440 /etc/sudoers.d/diagnoseme

# --- Finalization ---
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
popularity-contest popularity-contest/participate boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i hw-detect/load_firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
