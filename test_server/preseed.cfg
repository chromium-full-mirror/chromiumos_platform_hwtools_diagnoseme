# --- Localization & Language ---
d-i debian-installer/locale string en_US
d-i keyboard-configuration/xkb-keymap select us

# --- Network Setup ---
d-i netcfg/get_hostname string diagnoseme-server
d-i netcfg/get_domain string local

# --- Mirror Settings ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- Account Setup ---
d-i passwd/root-login boolean false
d-i passwd/user-fullname string diagnoseme
d-i passwd/username string diagnoseme
d-i passwd/user-password password diagnoseme
d-i passwd/user-password-again password diagnoseme
d-i user-setup/allow-password-weak boolean true

# --- Clock & Partitioning ---
d-i clock-setup/utc boolean true
d-i time/zone string US/Pacific
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- Package Selection ---
d-i base-installer/install-recommends boolean false
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string lightdm xfce4 xfce4-terminal xserver-xorg xserver-xorg-video-all xserver-xorg-input-all x11-xserver-utils xterm curl wget gnupg build-essential dkms sudo linux-headers-amd64 zenity libnotify-bin docker.io docker-compose docker-cli ethtool usbutils python3 libcurl4 libxmlb2 libjcat1
d-i pkgsel/upgrade select none
d-i pkgsel/updatedb boolean false

# --- Bootloader ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# --- LATE COMMAND (The First-Boot & Offline Asset Logic) ---
d-i preseed/late_command string \
  in-target sed -i "s/GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=\"quiet nvme_core.default_ps_max_latency_us=0\"/" /etc/default/grub; \
  in-target update-grub; \
  mkdir -p /target/var/lib/diagnoseme/images /target/var/lib/diagnoseme/deb /target/var/log/diagnoseme/rpcserver /target/var/log/diagnoseme/nginx /target/var/log/diagnoseme/envoy /target/etc/diagnoseme /target/usr/local/bin /target/usr/share/applications /target/home/diagnoseme/Desktop /target/etc/skel/Desktop ; \
  in-target sh -c "chown -R diagnoseme:diagnoseme /var/log/diagnoseme && find /var/log/diagnoseme -type d -exec chmod 0775 {} +" || true; \
  if [ -d /cdrom/offline_assets ]; then cp -r /cdrom/offline_assets/* /target/var/lib/diagnoseme/ 2>/dev/null || true; fi; \
  if [ -d /cdrom/cli_tools ]; then cp -r /cdrom/cli_tools/* /target/usr/local/bin/ 2>/dev/null || true; fi; \
  if [ -f /cdrom/cli_tools/config.env ]; then cp /cdrom/cli_tools/config.env /target/etc/diagnoseme/config.env 2>/dev/null || true; fi; \
  if [ -f /cdrom/cli_tools/docker-compose-prod.yaml ]; then cp /cdrom/cli_tools/docker-compose-prod.yaml /target/etc/diagnoseme/docker-compose.yaml 2>/dev/null || true; fi; \
  if [ -f /cdrom/cli_tools/docker-compose-maui.yaml ]; then cp /cdrom/cli_tools/docker-compose-maui.yaml /target/etc/diagnoseme/docker-compose-maui.yaml 2>/dev/null || true; fi; \
  if [ -f /cdrom/cli_tools/docker-compose-maui-h2h.yaml ]; then cp /cdrom/cli_tools/docker-compose-maui-h2h.yaml /target/etc/diagnoseme/docker-compose-maui-h2h.yaml 2>/dev/null || true; fi; \
  RESULTS_DIR=$(sed -n "s/^DIAGNOSEME_RESULTS_DIR=//p" /target/etc/diagnoseme/config.env 2>/dev/null | tail -n 1); if [ -n "$RESULTS_DIR" ]; then mkdir -p "/target$RESULTS_DIR"; in-target sh -c "chown diagnoseme:diagnoseme $RESULTS_DIR && chmod 0775 $RESULTS_DIR" || true; fi; \
  if [ -d /cdrom/desktop_launchers ]; then cp /cdrom/desktop_launchers/*.desktop /target/usr/share/applications/ 2>/dev/null || true; cp /cdrom/desktop_launchers/*.desktop /target/home/diagnoseme/Desktop/ 2>/dev/null || true; cp /cdrom/desktop_launchers/*.desktop /target/etc/skel/Desktop/ 2>/dev/null || true; fi; \
  in-target sh -c "if [ -f /var/lib/diagnoseme/deb/diagnoseme_amd64.deb ]; then dpkg -i /var/lib/diagnoseme/deb/diagnoseme_amd64.deb > /var/log/diagnoseme/deb-install.log 2>&1 || apt-get install -f -y >> /var/log/diagnoseme/deb-install.log 2>&1 || echo 'deb install failed' >> /var/log/diagnoseme/deb-install.log; else echo 'no deb on the ISO' > /var/log/diagnoseme/deb-install.log; fi"; \
  in-target chmod 755 /usr/local/bin/start-diagnoseme /usr/local/bin/stop-diagnoseme /usr/local/bin/diagnoseme-dashboard /usr/local/bin/diagnoseme-logs /usr/local/bin/diagnoseme-offline-update /usr/local/bin/maui-flash /usr/local/bin/maui-ctl 2>/dev/null || true; \
  in-target chmod 644 /etc/diagnoseme/docker-compose.yaml /etc/diagnoseme/config.env 2>/dev/null || true; \
  in-target chmod 644 /usr/share/applications/*.desktop 2>/dev/null || true; \
  in-target chmod 755 /home/diagnoseme/Desktop/*.desktop /etc/skel/Desktop/*.desktop 2>/dev/null || true; \
  if grep -q "^MODE=online" /target/etc/diagnoseme/config.env 2>/dev/null && [ -f /cdrom/iso_setup/diagnoseme-browser.desktop ]; then mkdir -p /target/home/diagnoseme/.config/autostart; cp /cdrom/iso_setup/diagnoseme-browser.desktop /target/home/diagnoseme/.config/autostart/; fi; \
  in-target chown -R diagnoseme:diagnoseme /home/diagnoseme; \
  in-target groupadd docker || true; \
  in-target usermod -aG docker diagnoseme || true; \
  in-target sh -c 'echo "diagnoseme ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/diagnoseme'; \
  in-target chmod 440 /etc/sudoers.d/diagnoseme; \
  in-target sed -i "s/#autologin-user=/autologin-user=diagnoseme/" /etc/lightdm/lightdm.conf; \
  in-target sed -i "s/#autologin-user-timeout=0/autologin-user-timeout=0/" /etc/lightdm/lightdm.conf; \
  in-target sed -i "s/#user-session=/user-session=xfce/" /etc/lightdm/lightdm.conf; \
  cp /cdrom/iso_setup/post-install-setup.sh /target/usr/local/bin/post-install-setup.sh; \
  in-target chmod +x /usr/local/bin/post-install-setup.sh; \
  in-target sh -c "echo '[Unit]' > /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo 'Description=DiagnoseMe first boot setup (Docker images, package check, apt source)' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo 'After=docker.service network-online.target' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo 'Wants=network-online.target' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo 'Requires=docker.service' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo '[Service]' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo 'Type=oneshot' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo 'ExecStart=/usr/local/bin/post-install-setup.sh' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo '[Install]' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target sh -c "echo 'WantedBy=multi-user.target' >> /etc/systemd/system/diagnoseme-setup.service"; \
  in-target systemctl enable diagnoseme-setup.service; \
  in-target sh -c 'echo "r8152" >> /etc/modules'; \
  in-target sh -c 'echo "blacklist cdc_ether" > /etc/modprobe.d/blacklist-diagnoseme.conf'; \
  in-target update-initramfs -u; \
  in-target sh -c "wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -P /tmp && (dpkg -i /tmp/google-chrome-stable_current_amd64.deb || apt-get install -f -y) && rm -f /tmp/google-chrome-stable_current_amd64.deb || true"

# --- Finalization ---
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
popularity-contest popularity-contest/participate boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i hw-detect/load_firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
