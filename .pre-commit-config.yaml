default_install_hook_types: [pre-commit, commit-msg]
default_stages: [commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
        exclude: .*\.svg
    -   id: trailing-whitespace
        exclude: .*\.svg
    -   id: check-toml
    -   id: check-merge-conflict

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        name: isort (python)
        types: [python]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.12
        types: [python]

  - repo: local
    hooks:
    - id: pylint
      name: pylint
      entry: pylint
      language: system
      exclude: ^hooks/
      types: [python]
      args:
        [
          "-rn", # Only display messages
          "-sn", # Don't display the score
        ]

  - repo: local
    hooks:
    - id: banned-words
      stages: [commit, commit-msg]
      name: banned-words
      entry: hooks/banned-words.py
      language: python
      types: [text]

  - repo: local
    hooks:
    - id: copyright
      name: copyright
      entry: hooks/copyright.py
      language: python
      types: [text]
      exclude: |
            (?x)^(
                docs/.*|
                .*md|
                .*\.hex|
                .gitignore|
                LICENSE|
                DIR_METADATA|
                PRESUBMIT.cfg|
                .*\.json
            )$
