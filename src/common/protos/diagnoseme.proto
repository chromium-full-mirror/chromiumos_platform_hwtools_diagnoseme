syntax = "proto3";

package diagnoseme;

service DiagnoseMeService {
  // Get Logs RPC call
  rpc get_logs(GetLogsRequest) returns (GetLogsResponse) {}
}

message GetLogsRequest {
  int32 line_count = 1;
}

message GetLogsResponse {
  string log_content = 1;
}
