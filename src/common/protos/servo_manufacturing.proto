syntax = "proto3";
package diagnoseme;
import "google/protobuf/empty.proto";
service ServoV41Manufacturing {
  // Example RPC call
  rpc get_status(google.protobuf.Empty) returns (StatusResponse) {}
  // New RPC call
  rpc program_genesys_hub(ProgramGenesysHubRequest) returns (ProgramGenesysHubResponse) {}
  // Program MCU RPC call
  rpc program_mcu(ProgramMcuRequest) returns (ProgramMcuResponse) {}
  // Program Serial RPC call
  rpc program_serial(ProgramSerialRequest) returns (ProgramSerialResponse) {}
  // Program Ethernet RPC call
  rpc program_ethernet(ProgramEthernetRequest) returns (ProgramEthernetResponse) {}
  // Program Atmega RPC call
  rpc program_atmega(ProgramAtmegaRequest) returns (ProgramAtmegaResponse) {}
  // Run Console Tests (Direct serial) RPC call
  rpc run_console_tests(RunTestsRequest) returns (RunTestsResponse) {}
  // Run Functional Tests (servod recovery) RPC call
  rpc run_functional_tests(RunTestsRequest) returns (RunTestsResponse) {}
  // Run Integration Tests (servod with DUT) RPC call
  rpc run_integration_tests(RunTestsRequest) returns (RunTestsResponse) {}
  // Validate Servo Serial RPC call
  rpc validate_servo_serial(ValidateServoSerialRequest) returns (ValidationResponse) {}
  // Validate Servo MAC Address RPC call
  rpc validate_servo_mac_address(ValidateServoMacAddressRequest) returns (ValidationResponse) {}
  // Check connected devices
  rpc get_device_presence(google.protobuf.Empty) returns (DevicePresenceResponse) {}
}

message StatusResponse {
  string status = 1;
}
message DevicePresenceResponse {
  bool mcu_dfu_detected = 1;
  bool servo_v4p1_detected = 2;
  bool realtek_eth_detected = 3;
}
message ProgramGenesysHubRequest {
  // Add request fields here
}
message ProgramGenesysHubResponse {
  // Add response fields here
  bool success = 1;
  string message = 2;
  string logs = 3;
}
message ProgramMcuRequest {
  // Add request fields here
  string firmware_path = 1;
}
message ProgramMcuResponse {
  // Add response fields here
  bool success = 1;
  string message = 2;
  string logs = 3;
}
message ProgramSerialRequest {
  string serial_number = 1;
}
message ProgramSerialResponse {
  bool success = 1;
  string message = 2;
  string logs = 3;
}
message ProgramEthernetRequest {
  // Add request fields here
  string mac_address = 1;
  string serial_number = 2;
}
message ProgramEthernetResponse {
  // Add response fields here
  bool success = 1;
  string message = 2;
  string logs = 3;
}
message ProgramAtmegaRequest {
  string serial_number = 1;
}
message ProgramAtmegaResponse {
  bool success = 1;
  string message = 2;
  string logs = 3;
}
message RunTestsRequest {
  // Add request fields here
  repeated string tests_to_run = 1;
  string serial_number = 2;
  string mac_address = 3;
}
message RunTestsResponse {
  // Add response fields here
  bool all_passed = 1;
  string summary = 2;
}
message ValidateServoSerialRequest {
  string serial_number = 1;
}
message ValidateServoMacAddressRequest {
  string mac_address = 1;
}
message ValidationResponse {
  bool is_valid = 1;
  string error = 2;
}
