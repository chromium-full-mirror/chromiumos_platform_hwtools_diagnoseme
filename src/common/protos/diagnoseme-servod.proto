syntax = "proto3";
package diagnoseme;
import "google/protobuf/empty.proto";
service ServodRpcService {
  rpc start_servod(StartServodRequest) returns (StartServodResponse) {}
  rpc get_dut_hardware_id(GetHardwareIDRequest) returns (GetHardwareIDResponse) {}
}

message StartServodRequest {
  string board = 1;
  optional string model = 2;
  optional string serial = 3;
}

message StartServodResponse {
  string console_output = 1;
  bool started = 2;
}

message GetHardwareIDRequest {
  string board = 1;
}

message GetHardwareIDResponse {
  string hwid = 1;
  string console_output = 2;
}
