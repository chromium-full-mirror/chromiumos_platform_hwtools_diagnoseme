<mat-toolbar color="primary" class="diagnoseme-toolbar">
  <button [matMenuTriggerFor]="menu" mat-icon-button class="example-icon" aria-label="Example icon-button with menu icon">
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <!-- Disabled legacy cards for Maui deployment
    <button mat-menu-item routerLink="/dolos-rework">Dolos Rework</button>
    <button mat-menu-item routerLink="/servo-v4p1-manufacturing">Servo Manufacturing</button>
    <button mat-menu-item routerLink="/servo-micro-manufacturing">Servo Micro Manufacturing</button>
    <mat-divider></mat-divider>
    -->
    <button mat-menu-item routerLink="/maui-step1">SMT Step 1: MCU & FTDI Provisioning + PDC Flashing</button>
    <button mat-menu-item routerLink="/maui-step2">SMT Step 2: SMT Functional Verification</button>
    <mat-divider></mat-divider>
    <button mat-menu-item routerLink="/maui-step3">FATP Step 3: Final Provisioning & Label Printing</button>
    <button mat-menu-item routerLink="/maui-step4">FATP Step 4: Full-Unit Quick Test (QT0)</button>
  </mat-menu>
  <span>HW Tools Diagnose Me</span>
  <span class="spacer"></span>
  @if (buildInfo) {
    <span class="build-info">
      Build: {{buildInfo.buildDate}} ({{buildInfo.commitSha}})
    </span>
  }
  <button mat-icon-button (click)="downloadLogs()" matTooltip="Download last 500 lines of rpcserver.log as ZIP">
    <mat-icon>file_download</mat-icon>
  </button>
</mat-toolbar>

<div class="top-level">
  <router-outlet></router-outlet>
</div>
