<div class="reworkcard" [class.disabled-card]="disabled">
  <mat-card>
    <mat-card-content>
      <h2>{{title}}</h2>
      <div class="f-container">
        <ng-content></ng-content>
      </div>
    </mat-card-content>
    <mat-card-footer>
      <div *ngIf="progress">
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      </div>
    </mat-card-footer>
  </mat-card>
</div>
