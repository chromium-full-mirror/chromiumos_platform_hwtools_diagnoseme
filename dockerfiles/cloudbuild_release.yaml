#
# Release build of a single DiagnoseMe edition. Every release trigger sets
# both substitutions (there are no defaults; the build fails at once when one
# is empty or the edition is not shipped, see editions.json):
#   _EDITION     the shipped edition, e.g. servo-dolos (the Servo / Dolos
#                'diagnoseme' package that the existing release trigger
#                builds) or maui-v1.1;
#   _COMMIT_SHA  the commit (the substitution of the existing trigger).
# Images are tagged <edition>-<commit>; tools/promote.sh moves the station
# tags (:<edition> and its aliases, servo-dolos: :release). For a manual run:
#   gcloud builds submit --config=dockerfiles/cloudbuild_release.yaml \
#     --substitutions=_EDITION=servo-dolos,_COMMIT_SHA=$(git rev-parse HEAD) .

substitutions:
  _EDITION: ''
  _COMMIT_SHA: ''

steps:

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'check-substitutions'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    if [ -z "${_EDITION}" ] || [ -z "${_COMMIT_SHA}" ]; then
      echo "ERROR: set the _EDITION (e.g. servo-dolos) and _COMMIT_SHA substitutions."
      exit 1
    fi
    python3 tools/edition_info.py validate --shipped "${_EDITION}"
  waitFor: ['-']

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'envoy'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/envoy:${_EDITION}-${_COMMIT_SHA}
  - --cache=true
  - --cache-ttl=96h
  - -f=/workspace/dockerfiles/envoy/Dockerfile
  waitFor: ['check-substitutions']

- name: 'gcr.io/cloud-builders/docker'
  id: 'proto-gen'
  args:
    - buildx
    - build
    - --output=./src/generated_tmp
    - --target=copytohost
    - -f=dockerfiles/utilities/Dockerfile.protoc
    - /workspace
  waitFor: ['check-substitutions']

- name: 'ubuntu'
  id: 'copy-python-protos'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    rm -rf src/server/generated
    mkdir -p src/server/generated
    cp -r src/generated_tmp/python/server/generated/* src/server/generated/
  waitFor: ['proto-gen']

- name: 'ubuntu'
  id: 'generate-build-info'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    mkdir -p /workspace/src/ui/src/assets
    echo "{\"buildDate\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"commitSha\": \"${_COMMIT_SHA}\", \"edition\": \"${_EDITION}\"}" > /workspace/src/ui/src/assets/build_info.json
  waitFor: ['check-substitutions']

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'server-base'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/server-base:${_EDITION}-${_COMMIT_SHA}
  - --target=base-${_EDITION}
  - --cache=true
  - --cache-ttl=96h
  - -f=/workspace/dockerfiles/rpcserver/Dockerfile.base
  waitFor: ['check-substitutions']

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'server'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/server:${_EDITION}-${_COMMIT_SHA}
  - --build-arg=BASE_IMAGE=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/server-base:${_EDITION}-${_COMMIT_SHA}
  - --build-arg=EDITION=${_EDITION}
  - --cache=true
  - --cache-ttl=96h
  - -f=/workspace/dockerfiles/rpcserver/Dockerfile
  waitFor: ['copy-python-protos', 'server-base', 'fetch-dist-blobs']

- name: 'node:24'
  id: 'ui-lint'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    mkdir -p src/ui/src/proto
    cp -r src/generated_tmp/typescript/server/* src/ui/src/proto/
    cd src/ui
    npm install --legacy-peer-deps
    npm run lint
  waitFor: ['proto-gen']

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'ui'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/ui:${_EDITION}-${_COMMIT_SHA}
  - --build-arg=EDITION=${_EDITION}
  - --cache=true
  - --cache-ttl=96h
  - -f=/workspace/dockerfiles/ui/Dockerfile
  waitFor: ['ui-lint', 'generate-build-info']

- name: 'pyfound/black:25.1.0'
  id: 'test-black-formatting'
  entrypoint: 'black'
  args:
    - --check
    - --config=/workspace/pyproject.toml
    - /workspace
  waitFor: ['check-substitutions']

- name: 'xcgd/isort'
  id: 'test-isort-formatting'
  entrypoint: 'isort'
  args:
    - --check
    - /workspace
  waitFor: ['check-substitutions']

- name: 'python:3.13'
  id: 'test-pylint'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    python3 -m pip install -r dockerfiles/rpcserver/requirements.txt --require-hashes --break-system-packages
    pylint --load-plugins=pylint_protobuf --rcfile=/workspace/pylintrc /workspace/src/server
  waitFor: ['copy-python-protos']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'fetch-dist-blobs'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    # The deb builder COPYs these; they must exist even when empty.
    mkdir -p dist/firmware dist/maui-utils
    # Realtek tools of the editions with realtek_tools (servo-dolos); fails
    # when they cannot be downloaded, a no-op for the other editions.
    tools/fetch_rtk_tools.sh "${_EDITION}"
    # Version of the deb (1.1.<YYYYMMDD>; the ISO's deb gets it from the
    # offline bundle builder, the same helper).
    tools/deb_version.sh > dist/deb-version
    # Maui editions bundle the stable maui-utils release (stable.dockertag);
    # their deb build fails without it.
    if [ "$(python3 tools/edition_info.py get "${_EDITION}" maui_utils)" = "true" ]; then
      tools/fetch_maui_utils.sh
    fi
  waitFor: ['check-substitutions']

- name: 'gcr.io/cloud-builders/docker'
  id: 'build-deb'
  entrypoint: 'bash'
  # The deb Dockerfile's optional dist/ COPYs need BuildKit (docker 20.10).
  env: ['DOCKER_BUILDKIT=1']
  args:
  - '-c'
  - |
    set -e
    docker build --build-arg DEB_VERSION="$(cat dist/deb-version)" --build-arg EDITION="${_EDITION}" \
      -t "deb-builder-${_EDITION}" -f development_environment/deb_builder/Dockerfile .
  waitFor: ['fetch-dist-blobs']

- name: 'gcr.io/cloud-builders/docker'
  id: 'extract-deb'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -e
      CONTAINER=$(docker create "deb-builder-${_EDITION}")
      docker cp "$${CONTAINER}:/diagnoseme.deb" .
      docker rm "$${CONTAINER}"
  waitFor: ['build-deb']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'check-deb'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      python3 tools/check_deb.py diagnoseme.deb "${_EDITION}"
  waitFor: ['extract-deb']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'upload-deb'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud artifacts apt upload diagnoseme-deb \
        --project=$PROJECT_ID \
        --location=us \
        --source=diagnoseme.deb
  waitFor: ['check-deb']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'build-iso'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    # build_iso.sh needs the docker CLI (the worker's docker socket is
    # available to every step) plus the ISO tools.
    apt-get update -qq
    apt-get install -y -qq libarchive-tools xorriso isolinux syslinux-common curl
    command -v docker > /dev/null || apt-get install -y -qq docker.io
    gcloud auth configure-docker us-docker.pkg.dev --quiet
    # Package the images pushed by this build; the ISO tags them as
    # :<edition> for the station (see build_iso.sh).
    DIAGNOSEME_COMMIT="${_COMMIT_SHA}" test_server/build_iso.sh \
      --edition "${_EDITION}" \
      --tag "${_EDITION}-${_COMMIT_SHA}" \
      --output "custom-debian-preseed-${_EDITION}.iso"
  waitFor: ['server', 'ui', 'envoy', 'fetch-dist-blobs']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'upload-iso'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -e
      ISO="test_server/custom-debian-preseed-${_EDITION}.iso"
      # Only servo-dolos owns the historical custom-debian-preseed-latest.iso
      # (editions.json iso_latest); the other editions write
      # custom-debian-preseed-<edition>-latest.iso.
      LATEST="$(python3 tools/edition_info.py get "${_EDITION}" iso_latest)"
      # TODO(editions): move to gs://diagnoseme_iso/<edition>/<version>/ with a
      # stable.isotag marker (the gs://maui-firmware layout) once promote.sh
      # handles ISOs.
      gcloud storage cp "$${ISO}" gs://diagnoseme_iso/custom-debian-preseed-${_EDITION}-${_COMMIT_SHA}.iso
      gcloud storage cp "$${ISO}" "gs://diagnoseme_iso/$${LATEST}"
  waitFor: ['build-iso']

options:
  machineType: 'E2_HIGHCPU_32'

timeout: 3600s
