steps:

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'envoy'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/envoy:$COMMIT_SHA
  - --cache=true
  - --cache-ttl=96h
  - -f=/workspace/dockerfiles/envoy/Dockerfile
  waitFor: ['-']

- name: 'gcr.io/cloud-builders/docker'
  id: 'proto-gen'
  args:
    - buildx
    - build
    - --output=./src/generated_tmp
    - --target=copytohost
    - -f=dockerfiles/utilities/Dockerfile.protoc
    - /workspace
  waitFor: ['-']

- name: 'ubuntu'
  id: 'copy-python-protos'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    rm -rf src/server/generated
    mkdir -p src/server/generated
    cp -r src/generated_tmp/python/server/generated/* src/server/generated/
  waitFor: ['proto-gen']

- name: 'ubuntu'
  id: 'generate-build-info'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    mkdir -p /workspace/src/ui/src/assets
    echo "{\"buildDate\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"commitSha\": \"$COMMIT_SHA\"}" > /workspace/src/ui/src/assets/build_info.json
  waitFor: ['-']

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'server-base'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/server-base:$COMMIT_SHA
  # Development image with every edition's tooling (base-<edition> targets
  # of the shipped editions are built by 'server-base-editions').
  - --target=base-all
  - --cache=true
  - --cache-ttl=96h
  - -f=/workspace/dockerfiles/rpcserver/Dockerfile.base
  waitFor: ['-']

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'server'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/server:$COMMIT_SHA
  - --build-arg=BASE_IMAGE=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/server-base:$COMMIT_SHA
  - --build-arg=EDITION=all
  - --cache=true
  - --cache-ttl=96h
  - -f=/workspace/dockerfiles/rpcserver/Dockerfile
  waitFor: ['copy-python-protos', 'server-base']

- name: 'node:24'
  id: 'ui-lint'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    mkdir -p src/ui/src/proto
    cp -r src/generated_tmp/typescript/server/* src/ui/src/proto/
    cd src/ui
    npm install --legacy-peer-deps
    npm run lint
    # Compile every edition (see editions.json / angular.json configurations).
    for EDITION in $(python3 ../../tools/edition_info.py list); do
      echo "Building UI edition $${EDITION}"
      npx ng build --configuration=production,$${EDITION} --output-path=/tmp/ui-$${EDITION}
    done
  waitFor: ['proto-gen']

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'ui'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/ui:$COMMIT_SHA
  - --build-arg=EDITION=all
  - --cache=true
  - --cache-ttl=96h
  - -f=/workspace/dockerfiles/ui/Dockerfile
  waitFor: ['ui-lint', 'generate-build-info']

- name: 'pyfound/black:25.1.0'
  id: 'test-black-formatting'
  entrypoint: 'black'
  args:
    - --check
    - --config=/workspace/pyproject.toml
    - /workspace
  waitFor: ['-']

- name: 'xcgd/isort'
  id: 'test-isort-formatting'
  entrypoint: 'isort'
  args:
    - --check
    - /workspace
  waitFor: ['-']

- name: 'python:3.13'
  id: 'test-pylint'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    python3 -m pip install -r dockerfiles/rpcserver/requirements.txt --require-hashes --break-system-packages
    pylint --load-plugins=pylint_protobuf --rcfile=/workspace/pylintrc /workspace/src/server
  waitFor: ['copy-python-protos']

- name: 'python:3.13'
  id: 'test-unit'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    # Backend and station script unit tests, incl. the editions.json
    # consistency checks (test_editions) and the config / deb checks.
    python3 -m pip install -r dockerfiles/rpcserver/requirements.txt --require-hashes --break-system-packages
    # pytest, and the docker module of servod.py (python3-docker in the image).
    python3 -m pip install pytest==9.2.0 docker==7.2.0 --break-system-packages
    python3 -m pytest -q -p no:cacheprovider src/server/tests/unit
  waitFor: ['copy-python-protos']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'fetch-dist-blobs'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    # The deb builder COPYs these; they must exist even when empty.
    mkdir -p dist/firmware dist/maui-utils
    # Shipped editions (editions.json), built one by one below.
    python3 tools/edition_info.py list --shipped > dist/shipped-editions
    echo "Shipped editions: $(tr '\n' ' ' < dist/shipped-editions)"
    # Realtek tools of the shipped editions with realtek_tools (servo-dolos);
    # fails when they cannot be downloaded.
    tools/fetch_rtk_tools.sh $(cat dist/shipped-editions)
    # Version of every deb (1.1.<YYYYMMDD>).
    tools/deb_version.sh > dist/deb-version
  waitFor: ['-']

- name: 'gcr.io/cloud-builders/docker'
  id: 'server-base-editions'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    # The server base target of every shipped edition (no push), so a broken
    # edition image shows up before the merge.
    for EDITION in $(cat dist/shipped-editions); do
      echo "Building server base target base-$${EDITION}"
      docker build --target "base-$${EDITION}" -t "server-base-$${EDITION}" \
        -f dockerfiles/rpcserver/Dockerfile.base .
    done
  waitFor: ['fetch-dist-blobs']

- name: 'gcr.io/cloud-builders/docker'
  id: 'build-deb'
  entrypoint: 'bash'
  # The deb Dockerfile's optional dist/ COPYs need BuildKit (docker 20.10).
  env: ['DOCKER_BUILDKIT=1']
  args:
  - '-c'
  - |
    set -e
    # The deb of every shipped edition (no upload). CQ does not download the
    # 2 GB maui-utils image, so the Maui debs are built without it.
    mkdir -p debs
    for EDITION in $(cat dist/shipped-editions); do
      echo "Building the $${EDITION} deb"
      docker build --build-arg DEB_VERSION="$(cat dist/deb-version)" \
        --build-arg EDITION="$${EDITION}" --build-arg ALLOW_NO_MAUI_UTILS=1 \
        -t "deb-builder-$${EDITION}" -f development_environment/deb_builder/Dockerfile .
      CONTAINER=$(docker create "deb-builder-$${EDITION}")
      docker cp "$${CONTAINER}:/diagnoseme.deb" "debs/$${EDITION}.deb"
      docker rm "$${CONTAINER}"
    done
  waitFor: ['fetch-dist-blobs']

- name: 'python:3.13'
  id: 'check-debs'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    # Control file (Package, Conflicts / Replaces) and config.env of every
    # edition deb (non-Maui: MODE=online, no Maui keys; see tools/check_deb.py).
    for EDITION in $(cat dist/shipped-editions); do
      python3 tools/check_deb.py --allow-no-maui-utils "debs/$${EDITION}.deb" "$${EDITION}"
    done
  waitFor: ['build-deb']

options:
  machineType: 'E2_HIGHCPU_32'

timeout: 5400s
