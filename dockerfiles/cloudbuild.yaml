steps:

- name: 'gcr.io/cloud-builders/git'
  id: 'src-prep'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -x
    rm -rf /workspace
    mkdir /workspace
    cd /workspace
    git clone $_REPO_URL .
    git fetch $_REPO_URL $COMMIT_SHA
    git checkout -b buildbranch FETCH_HEAD
    git branch --set-upstream-to=origin/$BRANCH_NAME buildbranch
    git config --global user.email "someone@example.com"
    git rebase

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'envoy'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/envoy:$COMMIT_SHA
  - --cache=true
  - --cache-ttl=96h
  - -f=/workspace/dockerfiles/envoy/Dockerfile
  waitFor: ['src-prep']

- name: 'gcr.io/cloud-builders/docker'
  id: 'proto-gen'
  args:
    - buildx
    - build
    - --output=./src/generated
    - --target=copytohost
    - -f=dockerfiles/utilities/Dockerfile.protoc
    - /workspace
  waitFor: ['src-prep']

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'server'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/server:$COMMIT_SHA
  - --cache=true
  - --cache-ttl=96h
  - -f=/workspace/dockerfiles/rpcserver/Dockerfile
  waitFor: ['src-prep', 'proto-gen']

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'ui'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/diagnoseme/ui:$COMMIT_SHA
  - --cache=true
  - --cache-ttl=96h
  - -f=/workspace/dockerfiles/ui/Dockerfile
  waitFor: ['src-prep', 'proto-gen']

- name: 'pyfound/black:25.1.0'
  id: 'test-black-formatting'
  entrypoint: 'black'
  args:
    - --check
    - --config=/workspace/pyproject.toml
    - /workspace
  waitFor: ['src-prep']

- name: 'xcgd/isort'
  id: 'test-isort-formatting'
  entrypoint: 'isort'
  args:
    - --check
    - /workspace
  waitFor: ['src-prep']

- name: 'python:3.13'
  id: 'test-pylint'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    python3 -m pip install -r dockerfiles/rpcserver/requirements.txt --require-hashes --break-system-packages
    cp src/generated/*.py src/server/
    pylint --load-plugins=pylint_protobuf --rcfile=/workspace/pylintrc /workspace/src/server
  waitFor: ['src-prep', 'proto-gen']

- name: 'node:25'
  id: 'ui-lint'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    mkdir -p src/ui/src/proto
    cp src/generated/*.ts src/ui/src/proto/
    cd src/ui
    npm install --legacy-peer-deps
    npm run lint
  waitFor: ['src-prep', 'proto-gen']

options:
  machineType: 'N1_HIGHCPU_32'

timeout: 3600s
